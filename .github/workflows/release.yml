name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    environment: production
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          export VERSION="$BASE.${{ github.run_number }}"
          node -e '
            const fs = require("fs");
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = process.argv[1];
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          ' "$VERSION"
          perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ if !$done && /^version = / && ($done = 1)' src-tauri/Cargo.toml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install meson and ninja
        run: brew install meson ninja

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Configure Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            {
              echo "APPLE_CERTIFICATE<<EOF"
              echo "$APPLE_CERTIFICATE"
              echo "EOF"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Apple signing enabled"
          else
            echo "Apple signing skipped (no APPLE_CERTIFICATE secret)"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOX_SUPABASE_URL: ${{ vars.VOX_SUPABASE_URL }}
          VOX_SUPABASE_ANON_KEY: ${{ vars.VOX_SUPABASE_ANON_KEY }}
          VOX_API_URL: ${{ vars.VOX_API_URL }}
          VOX_BRIDGE_URL: ${{ vars.VOX_BRIDGE_URL }}
          VOX_OAUTH_REDIRECT_URI: ${{ vars.VOX_OAUTH_REDIRECT_URI }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v${{ env.VERSION }}
          releaseName: Vox ${{ env.VERSION }}
          releaseBody: |
            Vox desktop voice client (Apple Silicon).

            ## Install (unsigned build)
            macOS may say the app is “damaged” because Gatekeeper quarantines unsigned downloads.
            After installing `Vox.app`, run:

            ```
            xattr -cr /Applications/Vox.app
            ```

            Or if it is still in Downloads:

            ```
            xattr -cr ~/Downloads/Vox*.dmg ~/Downloads/Vox*.app 2>/dev/null
            xattr -cr /Applications/Vox.app
            ```

            Then open **Vox** normally.

            Google sign-in redirect (Supabase Auth URL config): `vox://auth/callback`

            Add `APPLE_CERTIFICATE` (+ password / identity / notarization secrets) for signed/notarized releases that skip this step.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

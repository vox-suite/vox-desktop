[package]
name = "vox-desktop"
version = "0.1.0"
description = "Vox desktop voice client"
authors = ["Vox"]
edition = "2021"

[lib]
name = "vox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vox-meeting-recorder = { path = "../crates/meeting-recorder" }
vox-meeting-store = { path = "../crates/meeting-store" }
anyhow = "1"
vox-connections = { path = "../../vox-connections" }
vox-shared = { path = "../../vox-shared" }
vox-desktop-control = { path = "../../vox-desktop-control" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
keyring = "3"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
dotenvy = "0.15"
url = "2"
portable-pty = "0.9.0"
sysinfo = "0.39"
starship-battery = "0.11"
sonora = "=0.2.0"
rubato = "5.0.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSObject", "NSString"] }
objc2-core-location = { version = "0.3", features = ["CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

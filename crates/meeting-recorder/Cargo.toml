[package]
name = "vox-meeting-recorder"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
vox-meeting-store = { path = "../meeting-store" }
uuid = { version = "1", features = ["v4", "serde"] }
flexaudio = "=0.8.1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "=0.16.0"

[dev-dependencies]
tempfile = "3"
